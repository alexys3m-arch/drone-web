<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#090a0c">
<title>Classifica in diretta · Quota Zero</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="/gioco/gioco.css">
<style>
  /* Schermata da mostrare durante le dirette: classifica che si aggiorna da sola e obiettivo comune.
     Parametri: ?obiettivo=50 (partite da raggiungere oggi), ?premio=testo (cosa si sblocca). */
  body{background:var(--nero)}
  main{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
  .tag{display:flex;justify-content:space-between;align-items:center}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--rosso)}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--rosso);animation:pulsa 1.2s infinite}
  @keyframes pulsa{50%{opacity:.25}}
  h1{font-size:34px;margin:4px 0 0}
  .sfida{margin:0;font-size:16px;line-height:1.35;color:rgba(244,243,240,.85)}
  .podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:6px}
  .pd{text-align:center;border-radius:14px 14px 4px 4px;padding:10px 4px 12px;background:rgba(244,243,240,.06);border:1.5px solid rgba(244,243,240,.16)}
  .pd i{display:block;font:800 15px 'Syne',sans-serif;color:rgba(244,243,240,.6)}
  .pd b{display:block;font:700 26px 'Space Mono',monospace;letter-spacing:2px;margin:4px 0}
  .pd span{font:700 14px 'Space Mono',monospace;color:var(--oro)}
  .pd.p1{padding-top:22px;border-color:var(--oro);background:rgba(201,162,39,.14)}
  .pd.p1 b{font-size:32px;color:var(--giallo)}
  .pd.p2{padding-top:16px}
  ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  ol li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(244,243,240,.05);font:700 17px 'Space Mono',monospace}
  ol li .n{color:rgba(244,243,240,.55)} ol li .p{color:var(--oro)}
  .nuovo{animation:entra 2.6s ease-out}
  @keyframes entra{0%{background:var(--giallo);color:#111113;transform:scale(1.06)}100%{}}
  .ultimo{min-height:24px;margin:0;font:700 14px 'Space Mono',monospace;color:var(--giallo);text-align:center}
  .ob{border:1.5px solid rgba(201,162,39,.45);border-radius:14px;padding:12px 14px}
  .ob p{margin:0 0 8px;font-size:15px}.ob p b{color:var(--oro)}
  .barra-ob{height:14px;border-radius:8px;background:rgba(244,243,240,.1);overflow:hidden}
  .barra-ob u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--giallo));transition:width .8s}
  .ob small{display:block;margin-top:6px;font:700 12px 'Space Mono',monospace;color:rgba(244,243,240,.65)}
  .cta{margin-top:auto;text-align:center;background:var(--carta);color:#111113;border:3px solid #111113;border-radius:18px;padding:14px 10px;box-shadow:0 0 0 3px #fff}
  .cta span{display:block;font:400 15px 'Archivo Black',sans-serif}
  .cta b{display:block;font:800 21px/1.15 'Syne',sans-serif;margin-top:4px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <div class="tag"><span>Quota Zero · minigioco</span><span class="live"><i></i>live</span></div>
  <h1>Batti <em>il pilota</em>.</h1>
  <p class="sfida" id="sfida">Carico la classifica…</p>
  <div class="podio" id="podio"></div>
  <ol id="lista"></ol>
  <p class="ultimo" id="ultimo" aria-live="polite"></p>
  <section class="ob" id="ob" hidden>
    <p id="obt"></p>
    <div class="barra-ob"><u id="obb"></u></div>
    <small id="obn"></small>
  </section>
  <div class="cta"><span>Gioca adesso dal telefono</span><b>quotazerodrone.it/gioco</b></div>
</main>
<script>
(function () {
  const q = new URLSearchParams(location.search), evento = q.get('evento') || 'sfida';
  const obiettivo = Math.max(0, parseInt(q.get('obiettivo') || '0', 10)), premio = q.get('premio') || 'svelo il prossimo minigioco';
  const fmt = n => Number(n || 0).toLocaleString('it-IT');
  const $ = id => document.getElementById(id);
  let prima = null;   // classifica precedente, per accorgersi di chi entra
  const chiave = e => e.iniziali + ':' + e.punti;

  function disegna(c) {
    const top = c.top || [], nuovi = prima ? top.filter(e => !prima.has(chiave(e))) : [];
    const p = [top[1], top[0], top[2]];
    $('podio').innerHTML = p.map((e, k) => { const pos = [2, 1, 3][k]; return '<div class="pd p' + pos + (e && nuovi.includes(e) ? ' nuovo' : '') + '"><i>' + pos + '°</i><b>' + (e ? e.iniziali : '···') + '</b><span>' + (e ? fmt(e.punti) : 'libero') + '</span></div>'; }).join('');
    $('lista').innerHTML = top.slice(3, 8).map((e, k) => '<li' + (nuovi.includes(e) ? ' class="nuovo"' : '') + '><span class="n">' + (k + 4) + '</span><span>' + e.iniziali + '</span><span class="p">' + fmt(e.punti) + '</span></li>').join('');
    $('sfida').innerHTML = top[0] ? 'In testa c\'è <b class="g">' + top[0].iniziali + '</b> con ' + fmt(top[0].punti) + ' punti. Entra in classifica e fatti nominare in diretta.' : 'Il primo posto è libero.';
    if (nuovi.length) $('ultimo').textContent = 'Nuovo in classifica: ' + nuovi.map(e => e.iniziali + ' ' + fmt(e.punti)).join(' · ');
    prima = new Set(top.map(chiave));
  }
  function obiettivoComune(s) {
    if (!obiettivo) return;
    const n = (s.giorni && s.giorni[0] && s.giorni[0].decollo) || 0, pc = Math.min(100, n / obiettivo * 100);
    $('ob').hidden = false;
    $('obt').innerHTML = n >= obiettivo ? '<b>Obiettivo raggiunto!</b> Ora ' + premio + '.' : 'Se oggi arriviamo a <b>' + fmt(obiettivo) + ' partite</b>, ' + premio + '.';
    $('obb').style.width = pc + '%';
    $('obn').textContent = fmt(n) + ' / ' + fmt(obiettivo) + ' partite giocate oggi';
  }
  async function aggiorna() {
    try { disegna(await fetch('/api/classifica?evento=' + encodeURIComponent(evento), { cache: 'no-store' }).then(r => r.json())); } catch (_) {}
  }
  async function aggiornaObiettivo() {
    try { obiettivoComune(await fetch('/api/statistiche?giorni=1&evento=' + encodeURIComponent(evento), { cache: 'no-store' }).then(r => r.json())); } catch (_) {}
  }
  // classifica ogni 5 secondi, obiettivo ogni 20: poche letture sul database anche in dirette lunghe
  aggiorna(); setInterval(aggiorna, 5000);
  if (obiettivo) { aggiornaObiettivo(); setInterval(aggiornaObiettivo, 20000); }
})();
</script>
</body>
</html>
